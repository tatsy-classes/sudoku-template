[project]
name = "sudoku-solver"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.6.0",
  "matplotlib>=3.11.1",
  "numpy>=2.4.6",
  "opencv-python>=5.0.0.93",
  "pandas>=3.0.5",
  "pillow>=12.3.0",
  "scikit-learn>=1.9.0",
  "tqdm>=4.70.0",
]

[dependency-groups]
dev = ["mypy>=2.3.1", "pytest>=9.1.1", "ruff>=0.16.5"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
ignore = ["N806", "N812"]
fixable = ["ALL"]
unfixable = ["F401", "F841"]

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2
split-on-trailing-comma = true

[tool.ty.environment]
python = ".venv"
python-version = "3.11"

[tool.ty.terminal]
error-on-warning = false

[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
disallow_any_generics = true
strict_optional = true
check_untyped_defs = true
allow_redefinition = true

[tool.pytest.ini_options]
minversion = "8"
xfail_strict = true
addopts = ["--tb=no", "-s"]
testpaths = ["test_sudoku.py"]
log_cli_level = "DEBUG"
