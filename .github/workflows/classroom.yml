name: Autograding sudoku exercises

on:
  - push
  - workflow_dispatch

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: Evaluate submission
        uses: tatsy-classes/sudoku-autograding@feat/recognition-final-grading

      - name: Recognition L1 F1 >= 0.2
        id: recognition102
        uses: education/autograding-command-grader@v1
        with:
          test-name: Recognition L1 F1 >= 0.2
          command: python grade.py recognition --level 1 --threshold 0.2
          timeout: 0.25
          max-score: 2

      - name: Recognition L1 F1 >= 0.4
        id: recognition104
        uses: education/autograding-command-grader@v1
